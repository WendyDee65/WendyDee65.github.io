</head>

<body>

<header>
  <div class="logo">
    <img src="images/VineInLine.png" alt="Logo">
    <span>Vine In Line</span>
  </div>

   <nav>
    <a href="index.html">Home</a>

<main>
  <section class="section gallery-section">
    <div class="gallery-heading">
      <h1>Photo Gallery</h1>
      <p>
        Photos from Vine In Line classes, events, workshops, and outings.
      </p>
    </div>
    <div id="photo-gallery" class="photo-gallery"></div>
  </section>
</main>

<!-- Enlarged photo viewer -->
<div
  id="gallery-lightbox"
  class="gallery-lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="Enlarged gallery photo"
>
  <button
    type="button"
    class="lightbox-close"
    aria-label="Close enlarged photo"
  >
    &times;
  </button>

  <button
    type="button"
    class="lightbox-arrow lightbox-previous"
    aria-label="View previous photo"
  >
    &#10094;
  </button>

  <figure class="lightbox-content">
    <img id="lightbox-image" src="" alt="">
    <figcaption id="lightbox-caption"></figcaption>
  </figure>

  <button
    type="button"
    class="lightbox-arrow lightbox-next"
    aria-label="View next photo"
  >
    &#10095;
  </button>
</div>

<footer>
  <p>&copy; 2026 Vine In Line | SLO North County, CA</p>
</footer>

<script src="images.js"></script>
<script src="gallery.js"></script>

</body>
</html>
