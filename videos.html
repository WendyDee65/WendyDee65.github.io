<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Gallery</title>

  <link rel="stylesheet" href="styles.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap"
    rel="stylesheet"
  >

  <style>
    /* Video Gallery page layout */
    .video-section {
      width: 100%;
      max-width: none !important;
      padding: 2rem 1rem;
      box-sizing: border-box;
      text-align: center;
    }

    .video-section h1 {
      margin: 0 0 0.4rem;
    }

    .video-section > p {
      margin: 0 0 1.5rem;
    }

    .video-gallery {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 1rem;
      width: 100% !important;
      max-width: 1800px !important;
      margin: 0 auto !important;
      padding: 0;
      box-sizing: border-box;
      align-items: start;
    }

    /* Each video card */
    .video-gallery > div {
      width: 100% !important;
      min-width: 0;
      margin: 0 !important;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* Responsive YouTube videos */
    .video-gallery iframe {
      display: block;
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    /* Two videos per row on medium screens */
    @media (max-width: 1100px) {
      .video-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }
    }

    /* One video per row on phones */
    @media (max-width: 700px) {
      .video-gallery {
        grid-template-columns: 1fr !important;
      }

      .video-section {
        padding: 1.5rem 0.75rem;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="images/VineInLine.png" alt="Vine In Line logo">
    <span>Vine In Line</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="news.html">Current News</a>
    <a href="schedule.html">Schedule</a>
    <a href="listOfDances.html">List of Dances</a>
    <a href="events.html">Events</a>
    <a href="gallery.html">Photo Gallery</a>
    <a href="videos.html">Video Gallery</a>
    <a href="other_resources.html">Other Resources</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <section class="section video-section">
    <h1>Video Gallery</h1>

    <p>
      Videos from Vine In Line classes, demonstrations, and events.
    </p>

    <div id="video-gallery" class="video-gallery"></div>
  </section>
</main>

<footer>
  <p>&copy; 2026 Vine In Line | SLO North County, CA</p>
</footer>

<script src="videos.js"></script>

</body>
</html>
