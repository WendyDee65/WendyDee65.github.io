<header>
  <div class="logo">
    <img src="images/VineInLine.png" alt="Logo">
    <span>Vine In Line</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="news.html">Current News</a>
    <a href="schedule.html">Monthly Calendar</a>

<section class="section alt">
  <div id="resourcesContainer"></div>
</section>

<footer>
  <p>&copy; 2026 Vine In Line | SLO North County, CA</p>
</footer>

<script src="other_resources.js"></script>

<script>
  const resourcesContainer = document.getElementById("resourcesContainer");

  resourcesContainer.innerHTML = resourceSections.map((section, index) => `
    <details class="resource-section" ${index === 0 ? "open" : ""}>
      <summary>
        <h2>${section.title}</h2>
      </summary>

      <div class="resource-grid">
        ${section.resources.map(resource => `
          <div class="resource-card">
            <h3>
              ${resource.link
                ? `<a href="${resource.link}" target="_blank" rel="noopener noreferrer">${resource.title}</a>`
                : resource.title}
            </h3>

            ${resource.description
              ? `<p>${resource.description}</p>`
              : ""}
          </div>
        `).join("")}
      </div>
    </details>
  `).join("");
</script>

</body>
</html>
